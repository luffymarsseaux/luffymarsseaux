<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#071b15">
  <title>Lephie — Mini jeu de foot</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; color: #f4fff8; background: radial-gradient(ellipse at top, #174b35 0, #071b15 70%); }
    .game { width: min(100%, 940px); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 2px 12px; }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 2rem); }
    .badge { color: #c9f36a; font-weight: 800; letter-spacing: .06em; }
    .board { overflow: hidden; border: 2px solid #a6d677; border-radius: 18px; box-shadow: 0 20px 70px #0008; background: #19864b; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; }
    .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; }
    .score { font-size: 1.15rem; font-weight: 800; }
    .score strong { color: #c9f36a; font-size: 1.45rem; }
    button { border: 0; border-radius: 12px; padding: 11px 16px; color: #102015; background: #c9f36a; font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    button:hover { background: #ddff88; }
    .help { margin: 4px 2px 14px; color: #d3e6da; font-size: .92rem; line-height: 1.5; }
    .touch { display: none; grid-template-columns: repeat(3, 58px) 1fr; grid-template-rows: repeat(2, 52px); gap: 7px; align-items: center; margin: 12px auto 0; max-width: 290px; }
    .touch button { padding: 0; min-height: 48px; font-size: 1.25rem; user-select: none; -webkit-user-select: none; }
    .touch [data-key="ArrowUp"] { grid-column: 2; grid-row: 1; }
    .touch [data-key="ArrowLeft"] { grid-column: 1; grid-row: 2; }
    .touch [data-key="ArrowDown"] { grid-column: 2; grid-row: 2; }
    .touch [data-key="ArrowRight"] { grid-column: 3; grid-row: 2; }
    .touch [data-key="Space"] { grid-column: 4; grid-row: 1 / span 2; min-height: 105px; background: #ffce58; }
    .touch small { display: block; font-size: .65rem; }
    @media (pointer: coarse), (max-width: 650px) { .touch { display: grid; } .help { text-align: center; } }
  </style>
</head>
<body>
  <main class="game">
    <header><h1>⚽ Lephie — Mini jeu de foot</h1><span class="badge">TIR AU BUT</span></header>
    <div class="board"><canvas id="pitch" width="900" height="600" aria-label="Terrain de football interactif"></canvas></div>
    <section class="hud" aria-live="polite">
      <div class="score">Buts : <strong id="score">0</strong> &nbsp;|&nbsp; Temps : <strong id="time">60</strong>s</div>
      <button id="restart" type="button">↻ Rejouer</button>
    </section>
    <p class="help">Déplace-toi avec <b>← ↑ → ↓</b> ou <b>W A S D</b>. Appuie sur <b>ESPACE</b> près du ballon pour tirer et battre le gardien ! Sur téléphone, utilise les boutons ci-dessous.</p>
    <div class="touch" aria-label="Commandes tactiles">
      <button type="button" data-key="ArrowUp" aria-label="Haut">▲</button>
      <button type="button" data-key="ArrowLeft" aria-label="Gauche">◀</button>
      <button type="button" data-key="ArrowDown" aria-label="Bas">▼</button>
      <button type="button" data-key="ArrowRight" aria-label="Droite">▶</button>
      <button type="button" data-key="Space" aria-label="Tirer">⚽<small>TIRER</small></button>
    </div>
  </main>
<script>
(() => {
  const canvas = document.getElementById('pitch');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const W = canvas.width, H = canvas.height;
  const keys = new Set();
  const player = { x: W / 2, y: H - 115, r: 19, vx: 0, vy: 0, faceX: 0, faceY: -1 };
  const ball = { x: W / 2, y: H - 155, r: 10, vx: 0, vy: 0 };
  const keeper = { x: W / 2, y: 82, w: 76, h: 24, speed: 3.2, dir: 1 };
  let score = 0, seconds = 60, ended = false, last = performance.now(), message = 'À TOI DE JOUER !', messageUntil = 0;
  let lastGoal = 0;

  function resetBall() {
    player.x = W / 2; player.y = H - 115; player.vx = 0; player.vy = 0;
    player.faceX = 0; player.faceY = -1;
    ball.x = W / 2; ball.y = H - 155; ball.vx = 0; ball.vy = 0;
  }
  function restart() {
    score = 0; seconds = 60; ended = false; keeper.x = W / 2; keeper.speed = 3.2;
    scoreEl.textContent = score; timeEl.textContent = seconds; message = 'À TOI DE JOUER !'; messageUntil = performance.now() + 1500; resetBall();
  }
  function press(key) {
    if (key === 'Space') { keys.add('Space'); shoot(); }
    else keys.add(key);
  }
  function shoot() {
    if (ended || performance.now() - lastGoal < 700) return;
    const dx = ball.x - player.x, dy = ball.y - player.y;
    if (Math.hypot(dx, dy) > 66) { message = 'RAPPROCHE-TOI DU BALLON !'; messageUntil = performance.now() + 900; return; }
    const aimX = player.faceX * .3 + (W / 2 - ball.x) / W * .18;
    const aimY = Math.min(-.84, player.faceY - .15);
    const length = Math.hypot(aimX, aimY) || 1;
    ball.vx = aimX / length * 10.5; ball.vy = aimY / length * 10.5;
    message = 'TIR !'; messageUntil = performance.now() + 500;
  }
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const map = { arrowup: 'ArrowUp', w: 'ArrowUp', arrowdown: 'ArrowDown', s: 'ArrowDown', arrowleft: 'ArrowLeft', a: 'ArrowLeft', arrowright: 'ArrowRight', d: 'ArrowRight', ' ': 'Space' };
    if (map[k]) { e.preventDefault(); if (map[k] === 'Space' && !e.repeat) press('Space'); else keys.add(map[k]); }
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    const map = { arrowup: 'ArrowUp', w: 'ArrowUp', arrowdown: 'ArrowDown', s: 'ArrowDown', arrowleft: 'ArrowLeft', a: 'ArrowLeft', arrowright: 'ArrowRight', d: 'ArrowRight', ' ': 'Space' };
    if (map[k]) keys.delete(map[k]);
  });
  document.querySelectorAll('.touch button').forEach(button => {
    const key = button.dataset.key;
    button.addEventListener('pointerdown', e => { e.preventDefault(); button.setPointerCapture(e.pointerId); press(key); });
    const release = () => keys.delete(key);
    button.addEventListener('pointerup', release); button.addEventListener('pointercancel', release); button.addEventListener('lostpointercapture', release);
  });
  document.getElementById('restart').addEventListener('click', restart);

  function drawField() {
    ctx.fillStyle = '#16834a'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#16834a' : '#1c8b50'; ctx.fillRect(0, 125 + i * 78, W, 78); }
    ctx.strokeStyle = '#eaffed'; ctx.lineWidth = 3;
    ctx.strokeRect(22, 18, W - 44, H - 36);
    ctx.beginPath(); ctx.moveTo(22, H * .56); ctx.lineTo(W - 22, H * .56); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H * .56, 68, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeRect(W / 2 - 175, 18, 350, 135);
    ctx.strokeRect(W / 2 - 95, 18, 190, 65);
    ctx.beginPath(); ctx.arc(W / 2, 125, 5, 0, Math.PI * 2); ctx.fillStyle = '#eaffed'; ctx.fill();
    // Goal and net
    ctx.fillStyle = '#e6f4eb'; ctx.fillRect(W / 2 - 110, 13, 220, 12);
    ctx.strokeStyle = '#d7e7dc'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 100, -2, 200, 54);
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1;
    for (let x = W / 2 - 90; x < W / 2 + 100; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 48); ctx.stroke(); }
    for (let y = 10; y < 50; y += 14) { ctx.beginPath(); ctx.moveTo(W / 2 - 100, y); ctx.lineTo(W / 2 + 100, y); ctx.stroke(); }
  }
  function drawPlayer() {
    ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(player.x, player.y + 17, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(player.x, player.y - 7, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fa4354'; ctx.fillRect(player.x - 12, player.y + 3, 24, 23);
    ctx.fillStyle = '#fff'; ctx.fillRect(player.x - 12, player.y + 7, 24, 4);
    ctx.fillStyle = '#183a87'; ctx.fillRect(player.x - 11, player.y + 25, 9, 12); ctx.fillRect(player.x + 2, player.y + 25, 9, 12);
    ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(player.x + player.faceX * 14, player.y - 7 + player.faceY * 14, 3, 0, Math.PI * 2); ctx.fill();
  }
  function drawKeeper() {
    ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(keeper.x, keeper.y + 20, 42, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffc928'; ctx.fillRect(keeper.x - 25, keeper.y - 3, 50, 25);
    ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(keeper.x, keeper.y - 9, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(keeper.x - 39, keeper.y + 1, 13, 13); ctx.fillRect(keeper.x + 26, keeper.y + 1, 13, 13);
    ctx.fillStyle = '#25334e'; ctx.fillRect(keeper.x - 19, keeper.y + 22, 12, 8); ctx.fillRect(keeper.x + 7, keeper.y + 22, 12, 8);
  }
  function drawBall() {
    ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(ball.x + 2, ball.y + 8, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#17221a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#17221a'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  function frame(now) {
    const dt = Math.min((now - last) / 16.67, 2); last = now;
    if (!ended) {
      if (now - (frame.lastSecond || now) >= 1000) { seconds = Math.max(0, seconds - 1); timeEl.textContent = seconds; frame.lastSecond = now; if (!seconds) { ended = true; message = `TERMINÉ ! ${score} BUT${score > 1 ? 'S' : ''} !`; messageUntil = Infinity; } }
      let ix = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
      let iy = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
      if (ix || iy) { const n = Math.hypot(ix, iy); ix /= n; iy /= n; player.faceX = ix; player.faceY = iy; }
      player.x += ix * 4.1 * dt; player.y += iy * 4.1 * dt;
      player.x = Math.max(48, Math.min(W - 48, player.x)); player.y = Math.max(175, Math.min(H - 48, player.y));
      // Keep the ball close while dribbling; kick sends it free toward goal.
      const pd = Math.hypot(ball.x - player.x, ball.y - player.y);
      if (pd < 39 && Math.hypot(ball.vx, ball.vy) < 3.5) {
        ball.x += (player.x + player.faceX * 27 - ball.x) * .17 * dt;
        ball.y += (player.y + player.faceY * 27 - ball.y) * .17 * dt;
      }
      keeper.x += keeper.speed * keeper.dir * dt;
      if (keeper.x > W / 2 + 76 || keeper.x < W / 2 - 76) keeper.dir *= -1;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      ball.vx *= Math.pow(.985, dt); ball.vy *= Math.pow(.985, dt);
      if (ball.x < 34 || ball.x > W - 34) { ball.x = Math.max(34, Math.min(W - 34, ball.x)); ball.vx *= -.72; }
      if (ball.y > H - 35) { ball.y = H - 35; ball.vy *= -.68; }
      // Keeper blocks shots.
      if (ball.y < keeper.y + 24 && ball.y > keeper.y - 18 && Math.abs(ball.x - keeper.x) < 48 && Math.abs(ball.vy) > 1.5) {
        ball.y = keeper.y + 28; ball.vy = Math.abs(ball.vy) * .72; ball.vx += (ball.x - keeper.x) * .07;
        message = 'ARRÊT DU GARDIEN !'; messageUntil = now + 800;
      }
      // Goal mouth is 200px wide; shots must pass the keeper and cross the line.
      if (ball.y < 24 && ball.x > W / 2 - 98 && ball.x < W / 2 + 98) {
        score++; scoreEl.textContent = score; lastGoal = now; message = '⚽ BUUUUT !'; messageUntil = now + 1100;
        keeper.speed = Math.min(7, keeper.speed + .35); resetBall();
      } else if (ball.y < 12) { ball.y = 28; ball.vy = Math.abs(ball.vy) * .65; }
    }
    drawField(); drawKeeper(); drawPlayer(); drawBall();
    if (message && now < messageUntil) {
      ctx.fillStyle = '#06150dcc'; ctx.beginPath(); ctx.roundRect(W / 2 - 190, H / 2 - 30, 380, 60, 16); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '800 25px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(message, W / 2, H / 2);
    }
    if (ended) {
      ctx.fillStyle = '#04120dcc'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '800 40px system-ui'; ctx.fillText(`FIN DU MATCH !`, W / 2, H / 2 - 15);
      ctx.font = '700 24px system-ui'; ctx.fillText(`${score} but${score > 1 ? 's' : ''} marqué${score > 1 ? 's' : ''} — clique sur Rejouer`, W / 2, H / 2 + 30);
    }
    requestAnimationFrame(frame);
  }
  restart(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
